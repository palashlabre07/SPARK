<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPARK</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--ink:#12302b;--mute:#5b736d;--card:#fff;--line:#cfdcd8;--acc:#e8a317;--good:#2a8f5f;--bad:#c4452f;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f1c;--ink:#e6f1ee;--mute:#8fa9a2;--card:#16302b;--line:#27483f;--good:#4cc58a;--bad:#ef7a64;--warn:#f0b64a}}
:root[data-theme="dark"]{--bg:#0e1f1c;--ink:#e6f1ee;--mute:#8fa9a2;--card:#16302b;--line:#27483f;--good:#4cc58a;--bad:#ef7a64;--warn:#f0b64a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:28px 20px 56px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
h1{font-size:clamp(2.4rem,9vw,4rem);font-weight:800}h2{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:800}h3{font-size:1.2rem;font-weight:700}
p{margin:.5rem 0 0;color:var(--mute)}a{color:inherit}
.crumbs{font-size:.9rem;color:var(--mute);margin-bottom:22px}.crumbs a{color:var(--mute)}
.grid{display:grid;gap:14px;margin-top:26px}
.opt{display:block;text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:24px;transition:border-color .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--acc);outline:none;transform:translateX(4px)}
.opt h3{font-size:1.5rem}
.hero{border-left:8px solid var(--acc);padding-left:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel{margin-top:16px;padding:18px}
.kpi b{display:block;font:800 1.6rem 'Bricolage Grotesque',system-ui,sans-serif}.kpi span{color:var(--mute);font-size:.9rem}
.bad{color:var(--bad)}.good{color:var(--good)}.warn{color:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.tabs a{text-decoration:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-weight:600;font-size:.92rem}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.tag.s{border-color:var(--bad);color:var(--bad)}.tag.g{border-color:var(--good);color:var(--good)}.tag.w{border-color:var(--warn);color:var(--warn)}
.banner{margin-top:16px;padding:10px 14px;border:1px dashed var(--warn);border-radius:10px;font-size:.9rem;color:var(--warn)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.93rem;min-width:520px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
textarea,input[type=text]{width:100%}
button{cursor:pointer;font-weight:600}button.p{background:var(--acc);border-color:var(--acc);color:#12302b}button:disabled{opacity:.5;cursor:default}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc)}
label{display:block;margin-top:12px;font-weight:600;font-size:.92rem}
.note{font-size:.88rem;color:var(--mute);margin-top:8px}.msg{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--card);border:2px solid var(--good)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
svg text{fill:var(--mute);font:12px Figtree,sans-serif}
</style></head><body><main id="app"></main>
<script>
const RATE=8,EF=0.82,N=14,BASE=10; // ₹/kWh and kg CO2/kWh are ASSUMPTIONS: replace with your tariff and the current CEA grid factor
const campuses=[{name:"Main Campus",area:"Academic blocks, library, admin",m:1},{name:"Engineering Campus",area:"Labs, workshops, computer centre",m:1.35},{name:"Hostel Campus",area:"Hostels, mess, common areas",m:.85}];
const ZN=[{id:'lab',n:'Computer Lab 2',b:30,w:.4,a:3,eq:'40 PCs × 100 W × 8 h = 32 kWh'},{id:'lib',n:'Library',b:45,w:.7,a:4},{id:'host',n:'Hostel A',b:90,w:1.05,a:50,noAH:1},{id:'can',n:'Canteen',b:35,w:.8,a:6},{id:'aud',n:'Auditorium',b:20,w:.5,a:1},{id:'pump',n:'Water pumps',b:25,w:1,a:2}];
const occOv={};let camZ='lab',cur=0,msg='',acts=[{id:1,zone:'lib',rule:'R1',title:'Add closing checklist and timer for reading-room lights',owner:'Library in-charge',pri:'Medium',due:'done',status:'Resolved',note:'Timer fitted on reading-room lighting circuit. Closing checklist added.',rd:6}],
reps=[{id:1,zone:'lab',cat:'Computers left on',desc:'PCs still on at 10 PM',age:2,ok:true,},{id:2,zone:'lab',cat:'Lights left on',desc:'Lab lights on overnight',age:1,ok:false}],nid=10;
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('en-IN'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zn=id=>ZN.find(z=>z.id==id).n;
function rng(s){return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296}
function build(){const ro=rng(99+cur),r=rng(7+cur),m=campuses[cur].m,t=new Date();
 return ZN.map(z=>{const tot=[],ah=[],occ=[];for(let d=0;d<N;d++){const we=[0,6].includes(new Date(t-(N-1-d)*864e5).getDay());
  let T=z.b*(we?z.w:1)*m*(1+(r()-.5)*.1),A=z.a*m*(1+(r()-.5)*.2);
  if(z.id=='lab'&&d>=11){T+=28*m;A+=28*m}
  if(z.id=='lib'&&d>=2&&d<=5){T+=15*m;A+=15*m}
  if(z.id=='pump'&&d>=10)T*=1.35;
  if(z.id=='aud'&&d==N-1)T*=2.2;
  let O=ro()>.85?1:0;if(z.id=='lab')O=0;if(z.id=='lib'&&d==N-1){T+=12;A+=12;O=34}occ.push(O);tot.push(T);ah.push(A)}return{...z,tot,ah,occ,ev:z.id=='aud'}})}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,med=a=>{const s=[...a].sort((x,y)=>x-y),k=s.length>>1;return s.length%2?s[k]:(s[k-1]+s[k])/2},sd=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
function analyse(){const D=build(),al=[],exp=[];
 D.forEach(z=>{const T=z.tot[N-1],A=z.ah[N-1];
  if(!z.noAH){const md=med(z.ah.slice(0,BASE)),oc=occOv[z.id]??z.occ[N-1];if(A>Math.max(2*md,md+3)){const o={z:z.id,rule:'R1',name:'After-hours consumption',sev:oc===0?'High':'Medium',kwh:A-md,why:`After-hours use was ${A.toFixed(1)} kWh against a typical ${md.toFixed(1)} kWh (median of the first ${BASE} days). Threshold: more than 2× the median and 3 kWh above it. ${z.eq?'Equipment check: '+z.eq+' if all PCs stay on. ':''}Camera (YOLO person count): ${oc} ${oc==1?'person':'people'} after hours.`,fp:'Cameras can miss people who are out of view. Verify before acting.'};oc>=3?exp.push({...o,rule:'R4',name:'After-hours use with people present',why:`Camera shows about ${oc} people in the after-hours window, so this high use is likely legitimate (for example exam preparation). No alert raised. ${o.why}`}):al.push(oc===0?{...o,why:'Camera confirms the zone was empty. '+o.why}:o)}}
  const b=z.tot.slice(0,BASE),mu=avg(b),s=sd(b);
  if(T>mu+2.5*s&&T>1.15*mu){const o={z:z.id,rule:'R2',name:'Above baseline',sev:'Medium',kwh:T-mu,why:`Daily use was ${T.toFixed(0)} kWh against a baseline of ${mu.toFixed(0)} ± ${s.toFixed(1)} kWh. Flagged because it is more than 2.5 standard deviations and 15% above baseline.`,fp:'Could be weather, an event or higher occupancy. A steady rise on equipment like pumps can also mean a fault.'};
   z.ev?exp.push({...o,why:'Scheduled event logged for today, so this high use is expected and no alert is raised. '+o.why}):al.push(o)}});
 ZN.forEach(z=>{const n=reps.filter(r=>r.zone==z.id&&r.age<7).length;if(n>=3)al.push({z:z.id,rule:'R3',name:'Repeated waste reports',sev:'Medium',kwh:0,why:`${n} separate waste reports in the last 7 days for this zone.`,fp:'Reports are unverified until staff confirm them.'})});
 return{D,al,exp}}
const crumbs=t=>`<nav class="crumbs"><a href="#/">SPARK</a> / ${t}</nav>`;
const picker=()=>`<label>Campus<br><select id="cs">${campuses.map((c,i)=>`<option value="${i}"${i==cur?' selected':''}>${c.name}</option>`).join('')}</select></label>`;
const opt=(h,t,d)=>`<a class="opt" href="${h}"><h3>${t}</h3><p>${d}</p></a>`;
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
const money=k=>`₹${fmt(k*RATE)} · ${fmt(k*EF)} kg CO₂`;
function home(){$('app').innerHTML=`<h1>SPARK</h1><p>Save power, cut waste and shrink your campus carbon footprint.</p><div class="grid">${opt('#/energy/overview','Energy management','Monitor electricity, detect wastage, assign actions and verify savings.')}${opt('#/resource/overview','Resource management','Plan meals, log food waste and cut leftovers.')}${opt('#/carbon','Carbon emission','See the CO₂ footprint of campus energy use.')}</div>`}
const TABS=[['overview','Overview'],['alerts','Waste alerts'],['camera','Camera occupancy'],['report','Report waste'],['actions','Actions'],['savings','Savings']];
function energy(tab){const{D,al,exp}=analyse(),c=campuses[cur];let h='';
 const open=acts.filter(a=>a.status!='Resolved').length;
 if(tab=='overview'){const tt=D.reduce((a,z)=>a+z.tot[N-1],0),ta=D.reduce((a,z)=>a+(z.noAH?0:z.ah[N-1]),0),mx=Math.max(...D.map(z=>z.tot[N-1]));
  h=`<div class="kpis"><div class="kpi"><b>${fmt(tt)} kWh</b><span>Used today ${tag('simulated','s')}</span></div><div class="kpi"><b>₹${fmt(tt*RATE)}</b><span>Cost at ₹${RATE}/kWh ${tag('assumed rate','w')}</span></div><div class="kpi"><b class="bad">${fmt(al.reduce((a,x)=>a+x.kwh,0))} kWh</b><span>Possible avoidable ${tag('estimate','w')}</span></div><div class="kpi"><b>${al.length}</b><span>Active alerts, ${open} open actions</span></div></div>
  <div class="panel"><h3>Today by zone</h3><div class="scroll"><table><tr><th>Zone</th><th>kWh today</th><th></th><th>After hours kWh</th><th>People after hours (camera)</th><th>Status</th></tr>${D.map(z=>{const st=al.some(a=>a.z==z.id&&a.rule!='R3')?'<b class="bad">Alert</b>':exp.some(e=>e.z==z.id)?'<b class="warn">High, expected</b>':'<span class="good">Normal</span>';return`<tr><td>${z.n}</td><td>${fmt(z.tot[N-1])}</td><td style="width:30%"><div style="height:10px;border-radius:5px;background:var(--acc);width:${z.tot[N-1]/mx*100}%"></div></td><td>${z.noAH?'n/a (residents present)':z.ah[N-1].toFixed(1)}</td><td>${occOv[z.id]??z.occ[N-1]}</td><td>${st}</td></tr>`}).join('')}</table></div>
  <p class="note">Data quality: ${N} of ${N} days present for every zone. All values are SYNTHETIC demo readings, not measurements from a real campus.</p></div>`}
 if(tab=='alerts'){h=(al.length?al.map(a=>{const has=acts.some(x=>x.zone==a.z&&x.rule==a.rule&&x.status!='Resolved');return`<div class="card"><h3>${zn(a.z)}: ${a.name} ${tag(a.sev,a.sev=='High'?'s':'w')}</h3><p>${a.why}</p>${a.kwh?`<p><b>Potential avoidable:</b> ${a.kwh.toFixed(1)} kWh, ${money(a.kwh)} ${tag('estimate until verified','w')}</p>`:''}<p class="note">Possible false positive: ${a.fp}</p><button class="p" ${has?'disabled':''} onclick="mk('${a.z}','${a.rule}','${esc(a.name)}')">${has?'Action created':'Create action'}</button></div>`}).join(''):'<div class="card">No active alerts. Every zone is within its baseline.</div>')
  +exp.map(a=>`<div class="card"><h3>${zn(a.z)}: ${a.name} ${tag('expected','g')}</h3><p>${a.why}</p></div>`).join('')+'<p class="note">Hostel A is not checked for after-hours use because residents are present at night by design.</p>'}
 if(tab=='camera'){const z=D.find(x=>x.id==camZ),oc=occOv[z.id]??z.occ[N-1],pk={lab:38,lib:60,can:45,aud:20,pump:0,host:120}[z.id],dayL=(z.tot[N-1]-z.ah[N-1])/11,H=Array.from({length:24},(_,h)=>{const day=h>=8&&h<19,ni=h>=22||h<5;return{l:day?dayL:ni?z.ah[N-1]/7:.5,p:day?Math.round(pk*Math.sin(Math.PI*(h-8)/11)):ni?oc:0,ni}}),ml=Math.max(...H.map(x=>x.l)),mp=Math.max(1,...H.map(x=>x.p)),bw=640/24;
  h=`<div class="panel"><h3>How camera occupancy works</h3><p>A YOLO person detector (OpenCV + Ultralytics) runs on a small computer next to each CCTV camera and counts people every minute. Only the number leaves that computer. No video, images or faces are stored or sent. SPARK compares the count with electricity use to confirm waste or explain high use.</p></div>
  <div class="panel"><h3>People vs electricity by zone</h3><div class="scroll"><table><tr><th>Zone</th><th>Camera</th><th>Avg people after hours</th><th>After-hours kWh</th><th>Verdict</th></tr>${D.map(x=>{const o=occOv[x.id]??x.occ[N-1],a=al.find(y=>y.z==x.id&&y.rule=='R1'),e=exp.find(y=>y.z==x.id&&y.rule=='R4');return`<tr><td>${x.n}</td><td>CAM-${x.id.toUpperCase()}</td><td>${o}</td><td>${x.ah[N-1].toFixed(1)}</td><td>${x.noAH?'Not evaluated (residents present)':a?(o===0?'<b class="bad">Power on, nobody there</b>':'<b class="warn">High use, few people</b>'):e?'<b class="warn">High use, people present: expected</b>':'<span class="good">Normal</span>'}</td></tr>`}).join('')}</table></div><p class="note">${tag('simulated counts','s')} Replace them with real counts using the loader below.</p></div>
  <div class="panel"><h3>Today in one zone ${tag('simulated','s')}</h3><label>Zone<br><select onchange="camZ=this.value;route()">${ZN.map(x=>`<option value="${x.id}"${x.id==camZ?' selected':''}>${x.n}</option>`).join('')}</select></label>
  <div class="scroll"><svg viewBox="0 0 640 210" width="100%" style="min-width:480px">${H.map((x,i)=>`<rect x="${i*bw+3}" y="${180-x.l/ml*150}" width="${bw-6}" height="${x.l/ml*150}" rx="3" fill="${x.ni&&x.p===0&&x.l>1?'#c4452f':'#e8a317'}"/>${i%3==0?`<text x="${i*bw+bw/2}" y="200" text-anchor="middle">${i}h</text>`:''}`).join('')}<polyline fill="none" stroke="#2a8f5f" stroke-width="3" points="${H.map((x,i)=>`${i*bw+bw/2},${180-x.p/mp*150}`).join(' ')}"/></svg></div>
  <p class="note">Bars are electricity per hour. The green line is people counted. Red bars mean power is on while the camera counts nobody.</p></div>
  <div class="panel"><h3>Load camera counts</h3><p>Run <b>occupancy_agent.py</b> next to the camera and paste the lines it writes (occupancy.jsonl) here. Lines from 10 PM to 5 AM replace the simulated after-hours count for that zone.</p><textarea id="occin" rows="4" placeholder='{"zone":"lab","ts":"2026-10-12T23:00:05","people":0,"source":"yolo"}'></textarea><p><button class="p" onclick="occImp()">Load camera counts</button></p></div>`}
 if(tab=='report'){h=`<div class="panel"><h3>Report energy waste</h3><p>Scan the room's QR code, or choose the zone here. Do not touch electrical equipment. Just report what you see. No name is collected.</p>
  <label>Zone<br><select id="rz">${ZN.map(z=>`<option value="${z.id}">${z.n}</option>`).join('')}</select></label>
  <label>What did you see?<br><select id="rc">${['Lights left on','Fans running in empty room','Computers left on','Air conditioning running unnecessarily','Outdoor lights on in daylight','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label>Details (optional)<br><textarea id="rd" rows="2" maxlength="200"></textarea></label><p><button class="p" onclick="rep()">Submit report</button></p></div>
  <div class="panel"><h3>Recent reports</h3>${reps.length?reps.map(r=>`<div class="row"><span>${zn(r.zone)}: ${r.cat}${r.desc?' ('+esc(r.desc)+')':''}${r.n>1?' ×'+r.n:''}<br><span class="note">${r.age?r.age+' day(s) ago':'just now'} · ${r.ok?'verified by staff':'unverified'}</span></span>${r.ok?'':`<button onclick="ver(${r.id})">Verify</button>`}</div>`).join(''):'<p>No reports yet.</p>'}
  <p class="note">Duplicate reports for the same zone and issue on the same day are merged. Three separate reports in a week raise an alert.</p></div>`}
 if(tab=='actions'){h=acts.length?acts.map(a=>`<div class="card"><h3>${a.title} ${tag(a.status,a.status=='Resolved'?'g':'w')}</h3><p>${zn(a.zone)} · Owner: ${a.owner} · Priority: ${a.pri} · Due: ${a.due}</p>${a.status=='Resolved'?`<p>Resolution note: ${esc(a.note)}</p><p class="note">Resolved is not the same as saved. See the Savings tab for verification.</p>`:`<label>Resolution note<br><input type="text" id="n${a.id}" placeholder="What was done?"></label><p>${a.status=='Open'?`<button onclick="st(${a.id},'In progress')">Start work</button> `:''}<button class="p" onclick="res(${a.id})">Mark resolved</button></p>`}</div>`).join(''):'<div class="card">No actions yet. Create one from a waste alert.</div>'}
 if(tab=='savings'){const L=D.find(z=>z.id=='lib'),a=acts[0],b=L.ah.slice(2,6),p=L.ah.slice(7),ba=avg(b),pa=avg(p),pct=(ba-pa)/ba*100,sv=(ba-pa)*p.length;
  h=`<div class="panel"><h3>Library: after-hours fix ${tag('verified on demo data','g')}</h3><p>${a.title}</p>
  <div class="kpis"><div class="kpi"><b>${ba.toFixed(1)} kWh</b><span>Baseline per night (days 3 to 6, issue active)</span></div><div class="kpi"><b>${pa.toFixed(1)} kWh</b><span>After fix per night (days 8 to 14)</span></div><div class="kpi"><b class="good">${pct.toFixed(0)}%</b><span>Reduction</span></div><div class="kpi"><b class="good">${sv.toFixed(0)} kWh</b><span>${money(sv)} saved in ${p.length} days</span></div></div>
  <p class="note">Reduction % = (Baseline − After) ÷ Baseline × 100. Confidence: medium. Meter-based and compared per night, but occupancy, exam timetable and the weekday and weekend mix were not controlled. The ₹ and CO₂ figures use an assumed tariff and emission factor.</p></div>
  ${acts.slice(1).filter(x=>x.status=='Resolved').map(x=>`<div class="card"><h3>${x.title} ${tag('estimate only','w')}</h3><p>Resolved, but there are no follow-up readings yet. Collect at least 3 matched days of readings before claiming a saving.</p></div>`).join('')}`}
 $('app').innerHTML=crumbs('Energy management')+`<div class="hero"><h2>Energy management</h2><p>${c.name}: ${c.area}</p></div>${picker()}<div class="banner">SYNTHETIC demo data. Every figure here is simulated.</div>${msg?`<div class="msg">${msg}</div>`:''}<nav class="tabs">${TABS.map(t=>`<a href="#/energy/${t[0]}" class="${t[0]==tab?'on':''}">${t[1]}${t[0]=='alerts'&&al.length?' ('+al.length+')':''}</a>`).join('')}</nav>${h}`;msg=''}
function occImp(){const g={};let n=0;document.getElementById('occin').value.split('\n').forEach(l=>{try{const o=JSON.parse(l),h=new Date(o.ts).getHours();if(ZN.some(z=>z.id==o.zone)&&Number.isFinite(+o.people)&&+o.people>=0&&(h>=22||h<5)){(g[o.zone]=g[o.zone]||[]).push(+o.people);n++}}catch(e){}});
 Object.entries(g).forEach(([k,v])=>occOv[k]=Math.round(avg(v)*10)/10);msg=n?`Loaded ${n} camera counts for ${Object.keys(g).join(', ')}. Alerts now use these counts.`:'No valid after-hours lines found. Each line needs zone, ts (10 PM to 5 AM) and people.';route()}
function mk(z,rule,name){acts.push({id:nid++,zone:z,rule,title:name+': check '+zn(z),owner:z=='lab'?'Lab technician':'Facility team',pri:rule=='R1'?'High':'Medium',due:new Date(Date.now()+3*864e5).toLocaleDateString('en-IN'),status:'Open',note:''});msg='Action created and assigned.';location.hash='#/energy/actions'}
function st(id,s){acts.find(a=>a.id==id).status=s;route()}
function res(id){const n=$('n'+id).value.trim();if(!n){msg='Add a resolution note before resolving.';return route()}const a=acts.find(x=>x.id==id);a.status='Resolved';a.note=n;msg='Resolved. Collect follow-up readings to verify the saving.';route()}
function rep(){const z=$('rz').value,c=$('rc').value,d=$('rd').value.trim().slice(0,200),dup=reps.find(r=>r.zone==z&&r.cat==c&&r.age==0);
 if(dup){dup.n=(dup.n||1)+1;msg='This was already reported today, so it was added to the existing report.'}else{reps.unshift({id:nid++,zone:z,cat:c,desc:d,age:0,ok:false});msg='Report submitted. Thank you.'}route()}

const MEALS=['Breakfast','Lunch','Snacks','Dinner'],CATS=['Preparation scraps','Unserved cooked surplus','Plate returns','Spoiled / expired stock','Other'],REAS=['Overproduction','Low demand','Quality / taste','Excessive portion','Spoilage','Handling issue','Unknown'],DISP=['General disposal','Compost / biowaste','Approved donation','Other approved route','Unknown'];

function fsBatch(){if(!guard('stock'))return;const f=fs(),i=V('ki'),q=+V('kq'),b=V('kb');if(!i||!(q>0)||!b){msg='Enter an ingredient, a quantity above zero and a best-before date.';return route()}f.K.push({id:f.kid++,ing:i,qty:q,recv:iso(0),bb:b,loc:V('kl')});msg='Batch saved.';route()}
function fsDisc(id){if(!guard('stock'))return;const f=fs(),k=f.K.find(x=>x.id==id),s=f.S.find(x=>x.status!='Closed')||f.S[f.S.length-1];f.W.push({id:f.wid++,sid:s.id,item:'Mixed / unclassified',cat:CATS[3],reason:'Spoilage',kg:k.qty,disp:'General disposal',note:'Expired batch: '+k.ing,by:ROLES[role],at:iso(0)});aud('Stock discarded',`${k.ing} ${k.qty} kg`);k.qty=0;msg='Logged as spoiled stock.';route()}
function carbon(){const{D}=analyse(),c=campuses[cur],kwh=D.reduce((a,z)=>a+avg(z.tot),0)*30,co=kwh*EF/1000;
 $('app').innerHTML=crumbs('Carbon emission')+`<div class="hero"><h2>Carbon emission</h2><p>${c.area}. Monthly estimate from the demo data.</p></div>${picker()}<div class="kpis"><div class="kpi"><b>${fmt(kwh)} kWh</b><span>Electricity per month ${tag('estimate','w')}</span></div><div class="kpi"><b class="bad">${co.toFixed(1)} t CO₂</b><span>At ${EF} kg per kWh ${tag('assumed factor','w')}</span></div><div class="kpi"><b class="good">${fmt(co*1000/21)}</b><span>Trees to absorb it in a year (21 kg each, rough)</span></div></div><p class="note">Replace the emission factor with the current published CEA value before using these numbers.</p>`}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');
 p[0]=='energy'?energy(p[1]||'overview'):p[0]=='resource'?resource(p[1]||'overview'):p[0]=='carbon'?carbon():home();
 const s=$('cs');if(s)s.onchange=()=>{cur=+s.value;route()}}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
</script></body></html>
